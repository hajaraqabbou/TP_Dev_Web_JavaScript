
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 14 - Drag and Drop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Glisser-Déposer des éléments</h2>
    <p>Glissez un élément de la première zone vers la deuxième.</p>

    <div class="conteneur">
        <div class="zone" id="zone1">
            <h3>Zone 1</h3>
            <div id="element1" class="element" draggable="true">Élément 1</div>
            <div id="element2" class="element" draggable="true">Élément 2</div>
            <div id="element3" class="element" draggable="true">Élément 3</div>
        </div>

        <div class="zone" id="zone2">
            <h3>Zone 2</h3>
        </div>
    </div>

</body>
</html>
